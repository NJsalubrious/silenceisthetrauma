<script>
 // subtitles: on unless the visitor has turned them off (the faint "cc", bottom left); remembered in this browser
 (() => { const K = 'sitt-captions', b = document.querySelector('.cc'); if (!b) return; let on = true; try { on = localStorage.getItem(K) !== 'off'; } catch {}
  const set = v => { on = v; document.documentElement.classList.toggle('no-captions', !on); b.setAttribute('aria-pressed', String(on)); b.title = on ? 'Subtitles on' : 'Subtitles off'; try { localStorage.setItem(K, on ? 'on' : 'off'); } catch {} };
  set(on); for (const t of ['pointerdown', 'mousedown', 'touchstart', 'wheel']) b.addEventListener(t, e => e.stopPropagation(), { passive: true });
  b.addEventListener('click', e => { e.stopPropagation(); set(!on); b.blur(); }); })();
