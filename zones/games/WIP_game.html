<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIP | PixelStortion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Space+Grotesk:wght@700&display=swap"
        rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* The Static Background */
        .static {
            position: fixed;
            inset: 0;
            opacity: 0.08;
            background: url('https://media.giphy.com/media/oEI9uWUPr9WUM/giphy.gif');
            background-size: cover;
            z-index: -1;
        }

        /* Scanlines from index.html */
        .scanlines {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .container {
            max-width: 600px;
            padding: 20px;
            z-index: 20;
        }

        .wip-image {
            width: 100%;
            border: 1px solid #333;
            margin-bottom: 2rem;
            filter: grayscale(1);
        }
    </style>

    <!-- PIXELSTORTION BRANDING -->
    <style>
        .brand-dropdown-container { position: fixed; top: 10px; left: 12px; z-index: 10000; min-width: 160px; pointer-events: auto; }
        .ps-brand { font-family: monospace; font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.5); text-decoration: none; transition: color 0.2s, text-shadow 0.2s; cursor: pointer; }
        .ps-brand:hover { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .brand-dropdown-menu { position: absolute; top: 100%; left: 0; margin-top: 6px; background: rgba(5,5,5,0.95); border: 1px solid #333; min-width: 180px; opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.3s ease; backdrop-filter: blur(8px); z-index: 10001; display: flex; flex-direction: column; padding: 4px 0; text-align: left; }
        .brand-dropdown-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .brand-dropdown-item { color: #ccc; padding: 8px 12px; text-decoration: none; display: block; font-family: monospace; font-size: 12px; transition: all 0.2s ease; }
        .brand-dropdown-item:hover { background-color: #111; color: #fff; padding-left: 16px; }
    </style>

</head>

<body>

    <!-- PIXELSTORTION BRANDING DROPDOWN -->
    <div class="brand-dropdown-container">
        <button onclick="toggleBrandMenu(event)" style="background:none;border:none;padding:0;cursor:pointer;">
            <span class="ps-brand">PIXELSTORTION</span>
        </button>
        <div id="brandDropdown" class="brand-dropdown-menu" onclick="event.stopPropagation()">
            <a href="https://silenceisthetrauma.com/veX_social_network/" class="brand-dropdown-item" style="border-bottom:1px solid #222;margin-bottom:4px;">veX: Social Network</a>
            <a href="https://silenceisthetrauma.com/" class="brand-dropdown-item" style="border-bottom:1px solid #222;margin-bottom:4px;">Silence is the trauma</a>
            <a href="https://islaband.com" class="brand-dropdown-item" style="border-bottom:1px solid #222;margin-bottom:4px;">Isla</a>
            <a href="https://ethelryker.com/" class="brand-dropdown-item" style="border-bottom:1px solid #222;margin-bottom:4px;">Ethel Ryker</a>
            <a href="https://dominicryker.com/" class="brand-dropdown-item" style="border-bottom:1px solid #222;margin-bottom:4px;">Dominic Ryker</a>
            <a href="https://pixelstortion.com/" class="brand-dropdown-item" style="border-bottom:1px solid #222;margin-bottom:4px;">Nalani</a>
            <a href="https://pixelstortion.com/bio/" class="brand-dropdown-item" style="border-bottom:1px solid #222;margin-bottom:4px;">BIO</a>
        </div>
    </div>
    <script>
        window.toggleBrandMenu = function(e) { e.stopPropagation(); document.getElementById('brandDropdown').classList.toggle('active'); };
        document.addEventListener('click', () => { const m = document.getElementById('brandDropdown'); if (m) m.classList.remove('active'); });
    </script>


    
<main data-barba="container" data-barba-namespace="standalone">

    </style>


    <div class="static"></div>
    <div class="scanlines"></div>

    <div class="container">


        <h1 class="text-3xl font-black uppercase tracking-tighter mb-4">This Game is a WIP</h1>
        <p class="font-mono text-sm text-gray-400 leading-relaxed uppercase tracking-widest">
            I am currently working on this project. <br>
            Please come back in a week or two to see the first version.
        </p>

        <a href="index.html"
            class="inline-block mt-8 font-mono text-[10px] text-gray-500 hover:text-white transition-colors uppercase tracking-[0.3em]">
            [ Back to Index ]
        </a>
    </div>
</main>
</body>

</html>
