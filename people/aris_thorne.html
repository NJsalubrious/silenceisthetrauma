    <style>
        :root {
            --bg: #f4f4f6;
            --text-dark: #0a0a0a;
            --clinical-blue: #3a506b;
            --accent: #5bc0be;
            --anxiety-level: 0.8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        /* Top Navigation */
        header {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Split layout */
        main {
            display: flex;
            flex: 1;
        }

        .visual-pane {
            flex: 1;
            background-image: url('../assets/images/characters/cards/aris_thorne-card.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            /* Inducing a slight sense of unease through desaturation */
            filter: grayscale(80%) contrast(1.1);
        }

        .content-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            background: white;
            box-shadow: -10px 0 30px rgba(0,0,0,0.02);
            position: relative;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            line-height: 1.2;
            margin-bottom: 2rem;
            letter-spacing: -1px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #555;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        /* The anxiety-inducing form */
        .form-group {
            margin-bottom: 2rem;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            color: var(--clinical-blue);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 1rem 0;
            border: none;
            border-bottom: 2px solid #eaeaea;
            background: transparent;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-bottom-color: var(--text-dark);
        }

        button {
            display: inline-block;
            padding: 1rem 3rem;
            background: var(--text-dark);
            color: white;
            border: none;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        button:hover { background: var(--clinical-blue); }

        .spinner {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s infinite linear;
        }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .btn-loading { color: transparent !important; pointer-events: none; }
        .btn-loading .spinner { display: block; }
    </style>

    <!-- Legal & SEO Satire Declarations -->

<body>
    <header>
        <div class="logo">Thorne Analytics</div>
        <div style="font-size: 0.8rem; letter-spacing: 1px; color: #888;">SEOUL &bull; GLOBAL</div>
    </header>

    <main>
        <div class="visual-pane" aria-label="Abstract representation of psychological confinement"></div>
        <div class="content-pane">
            <h1>Behavioral<br>Architectures.</h1>
            <p>We analyze behavioral vulnerabilities within corporate structures. By identifying cognitive dependencies, we engineer safety nets that your executives will instinctively seek out during periods of market uncertainty.</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label>Target Identification Number</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Authorized Email</label>
                    <input type="email" required>
                </div>
                <button type="submit" id="submitBtn">
                    <span>Initiate Audit</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>
    </main>

    <script>
        // Environmental UX Storytelling:
        // Simulates uncertainty by artificially delaying the form response (Aris Thorne's signature).
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.classList.add('btn-loading');
            
            // Random delay between 4 and 12 seconds
            const delay = Math.floor(Math.random() * 8000) + 4000;
            
            setTimeout(() => {
                btn.classList.remove('btn-loading');
                btn.innerHTML = "<span>Audit Processing (Est. 7 Days)</span>";
                btn.style.background = "#3a506b";
            }, delay);
        });
    </script>
<script src="pixelstortion-overlay.js"></script>
